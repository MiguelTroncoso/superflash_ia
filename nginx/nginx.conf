user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65s;
    server_tokens off;

    # Límites conservadores para una API JSON de solo lectura.
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    # Compresión para respuestas JSON y documentación HTTP.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/problem+json application/javascript
               application/xml text/css text/plain text/xml;
    gzip_vary on;

    # Límite básico por IP. El endpoint /health queda excluido en default.conf.
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
