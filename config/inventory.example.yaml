# Ejemplo de inventario de infraestructura para la fuente Prometheus.
#
# Copia este archivo a config/inventory.yaml (NO versionado) y reemplaza
# los valores por los de tu entorno. Nunca subas el inventario real al
# repositorio: puede revelar direcciones internas de tu infraestructura.
#
# node_exporter_instance debe coincidir EXACTAMENTE con la etiqueta
# "instance" que Prometheus asigna a cada node_exporter (host:puerto).
# Las direcciones de este ejemplo son de documentación (RFC 5737).

servers:
  - external_id: srv-main-01
    name: Main 01
    hostname: main01.example.internal
    role: main                    # main | live | vod | other
    network_capacity_mbps: 20000
    node_exporter_instance: "192.0.2.10:9100"
    enabled: true

  - external_id: srv-live-01
    name: Live 01
    hostname: live01.example.internal
    role: live
    network_capacity_mbps: 10000
    node_exporter_instance: "192.0.2.11:9100"
    enabled: true

  - external_id: srv-vod-01
    name: VOD 01
    hostname: vod01.example.internal
    role: vod
    network_capacity_mbps: 5000
    node_exporter_instance: "192.0.2.12:9100"
    enabled: true
