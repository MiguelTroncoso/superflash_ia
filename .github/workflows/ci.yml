name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formato)
        run: ruff format --check .
      - name: MyPy
        run: mypy app scripts
      - name: Pytest
        run: pytest

  postgres-smoke:
    name: Smoke test con PostgreSQL real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: superflash
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: superflash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superflash -d superflash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://superflash:ci-only-password@localhost:5432/superflash_test
      # Clave efímera exclusiva del job de CI; no es un secreto real.
      API_KEY: ci-smoke-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Smoke test end-to-end (migraciones + API)
        run: python scripts/smoke_test.py
      - name: Advisory lock contra PostgreSQL real
        env:
          SUPERFLASH_TEST_PG_URL: postgresql+psycopg://superflash:ci-only-password@localhost:5432/superflash_test
        run: pytest tests/test_lock.py -q
